---
name: Terraform

on:
  pull_request:
    paths:
      - infra/**
      - .github/workflows/terraform.yml
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to apply
        required: true
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [preview, production]
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TERRAFORM_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRAFORM_STATE_SECRET_ACCESS_KEY }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_IN_AUTOMATION: "true"
    steps:
      - name: Setup | Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup | Terraform
        # v3.1.2
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.15.2

      - name: Validate | Format
        run: terraform fmt -check -recursive
        working-directory: infra

      - name: Setup | Initialize Terraform
        run: >-
          terraform init
          -input=false
          -backend-config="bucket=blog-ojii3-terraform-state"
          -backend-config="endpoints.s3=https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"
        working-directory: infra/${{ matrix.environment }}

      - name: Validate | Configuration
        run: terraform validate
        working-directory: infra/${{ matrix.environment }}

      - name: Validate | Plan
        run: terraform plan -input=false -no-color
        working-directory: infra/${{ matrix.environment }}

  apply:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TERRAFORM_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRAFORM_STATE_SECRET_ACCESS_KEY }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_IN_AUTOMATION: "true"
    steps:
      - name: Setup | Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup | Terraform
        # v3.1.2
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.15.2

      - name: Setup | Initialize Terraform
        run: >-
          terraform init
          -input=false
          -backend-config="bucket=blog-ojii3-terraform-state"
          -backend-config="endpoints.s3=https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"
        working-directory: infra/${{ inputs.environment }}

      - name: Run | Apply Terraform
        run: terraform apply -input=false -auto-approve
        working-directory: infra/${{ inputs.environment }}

      - name: Report | Terraform outputs
        run: terraform output -json
        working-directory: infra/${{ inputs.environment }}
