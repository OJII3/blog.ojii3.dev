---
# yamllint disable rule:line-length
name: Deploy Preview & Publish Production
"on":
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [deploy]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy-preview.outputs.deployment-url }}
    outputs:
      success: ${{ steps.deploy-preview.outcome == 'success' }}
      version_tag: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Setup | Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup | Bun
        # v2.0.2
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version-file: ".bun-version"

      - name: Setup | Install dependencies
        run: bun install --frozen-lockfile

      - name: Run | Put Worker secrets
        run: |
          wrangler_args=()
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            wrangler_args+=(--env preview)
          fi

          if [[ -z "$BETTER_AUTH_SECRET" || -z "$GH_APP_CLIENT_SECRET" ]]; then
            echo "Required Worker secrets are missing"
            exit 1
          fi

          printf '%s' "$BETTER_AUTH_SECRET" | \
            bun wrangler secret put BETTER_AUTH_SECRET "${wrangler_args[@]}"
          printf '%s' "$GH_APP_CLIENT_SECRET" | \
            bun wrangler secret put GH_APP_CLIENT_SECRET "${wrangler_args[@]}"
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GH_APP_CLIENT_SECRET: ${{ secrets.GH_APP_CLIENT_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Setup | Post comment
        if: github.event_name == 'pull_request'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --edit-last \
            --create-if-none \
            --body-file - <<EOF
          ### <span aria-hidden="true">🚧</span> Deploy Preview building...

          |  Name | Link |
          |---------------------------------|------------------------|
          |<span aria-hidden="true">🔨</span> Latest commit | ${{ github.sha }} |
          |<span aria-hidden="true">🔍</span> Latest deploy log | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |
          ---
          EOF
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup | Get version
        id: get-version
        run: |
          version="$(git rev-parse --short "${{ github.sha }}")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Run | Build
        run: bun run build
        env:
          CLOUDFLARE_ENV: ${{ github.event_name == 'pull_request' && 'preview' || '' }}
          GOOGLE_ANALYTICS_ID: ${{ secrets.GOOGLE_ANALYTICS_ID }}
          GH_APP_CLIENT_ID: ${{ secrets.GH_APP_CLIENT_ID }}
          GH_APP_CLIENT_SECRET: ${{ secrets.GH_APP_CLIENT_SECRET }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

      - name: Run | Apply preview D1 migrations
        if: github.event_name == 'pull_request'
        run: bun wrangler d1 migrations apply blog-content-preview --remote --env preview
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Run | Deploy
        # v3.14.1
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65
        id: deploy-preview
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: >-
            versions
            upload
            ${{ github.event_name == 'pull_request' && '--env preview' || '' }}
            --tag "${{ steps.get-version.outputs.version }}"
            --message "${{ github.event_name == 'pull_request' &&
            format('Preview deployment for PR #{0}',
            github.event.pull_request.number) || 'Release deployment' }}"

      - name: Finish | Post comment
        if: github.event_name == 'pull_request'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --edit-last \
            --create-if-none \
            --body-file - <<EOF
          ### <span aria-hidden="true">✅</span> Deploy Preview ready!

          |  Name | Link |
          |---------------------------------|------------------------|
          |<span aria-hidden="true">🔨</span> Latest commit | ${{ github.sha }} |
          |<span aria-hidden="true">🔍</span> Latest deploy log | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |
          |<span aria-hidden="true">🌐</span> Preview link | [${{ steps.deploy-preview.outputs.deployment-url }}](${{ steps.deploy-preview.outputs.deployment-url }}) |
          ---
          EOF
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: deploy
    if: needs.deploy.outputs.success == 'true' && (github.event_name == 'push' || github.event_name == 'repository_dispatch')
    steps:
      - name: Setup | Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup | Bun
        # v2.0.2
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version-file: ".bun-version"

      - name: Setup | Install dependencies
        run: bun install --frozen-lockfile

      - name: Run | Apply D1 migrations
        run: bun wrangler d1 migrations apply blog-content --remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Run | Backfill rendered HTML
        run: bun run backfill-rendered-html -- --remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Run | Backfill OG images
        run: bun run backfill-og-images -- --remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Setup | Get version ID
        id: get-version-id
        run: |
          version_id="$(bun wrangler versions list --json | \
            jq -r 'last(.[] |
            select(.annotations."workers/tag" == "${{ needs.deploy.outputs.version_tag }}") | .id) // ""')"

          if [ -z "$version_id" ]; then
            echo "Error: No version found with tag ${{ needs.deploy.outputs.version_tag }}"
            exit 1
          fi

          echo "Found version ID: $version_id"
          echo "version_id=${version_id}" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Run | Publish
        # v3.14.1
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65
        id: publish
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: |
            versions deploy ${{ steps.get-version-id.outputs.version_id }} -y
